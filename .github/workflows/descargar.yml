name: Instant nube
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Una sola corrida a la vez (para no bajar lo mismo dos veces).
concurrency:
  group: instant-nube
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      INSTANT_EMAIL: ${{ secrets.INSTANT_EMAIL }}
      INSTANT_PASSWORD: ${{ secrets.INSTANT_PASSWORD }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Revisar si hay enlaces pendientes
        id: revisar
        run: node nube/procesar.js --revisar
      - name: Instalar herramientas
        if: steps.revisar.outputs.hay == 'true'
        # Antes fallaba de vez en cuando (apt-get "exit code 100") porque el servidor de paquetes a veces no responde:
        # ahora se actualiza la lista y se reintenta varias veces antes de rendirse.
        run: |
          if ! command -v ffmpeg > /dev/null; then
            ok=0
            for i in 1 2 3 4 5; do
              if sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; then ok=1; break; fi
              echo "No se pudo instalar ffmpeg (intento $i de 5). Reintento en $((i * 10)) s"; sleep $((i * 10))
            done
            [ "$ok" = "1" ]
          fi
          ok=0
          for i in 1 2 3 4; do
            if pip install -q -U --retries 5 "yt-dlp[default,curl-cffi]" > /dev/null; then ok=1; break; fi
            echo "No se pudo instalar yt-dlp (intento $i de 4). Reintento en $((i * 8)) s"; sleep $((i * 8))
          done
          [ "$ok" = "1" ]
          ffmpeg -version | head -n 1
          yt-dlp --version
      - name: Descargar y subir a Drive
        if: steps.revisar.outputs.hay == 'true'
        run: node nube/procesar.js
