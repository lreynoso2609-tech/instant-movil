<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instant</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050806">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fuentes.css">
<link rel="stylesheet" href="movil.css">
</head>
<body>
<main class="app">
  <header class="top"><img src="logo.svg" alt="" width="36" height="36"><h1>Instant</h1><button class="salir" id="salir" hidden>Salir</button></header>

  <section id="login" hidden>
    <p class="soft">Entra con tu correo para mandar enlaces a tu biblioteca.</p>
    <form id="formLogin" autocomplete="on">
      <label>Correo<input id="correo" type="email" autocomplete="username" required></label>
      <label>Contraseña<input id="clave" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Entrar</button>
    </form>
  </section>

  <section id="panel" hidden>
    <form id="formEnlaces">
      <label for="enlaces">Pega uno o varios enlaces (TikTok, Instagram o Facebook)</label>
      <textarea id="enlaces" rows="4" placeholder="https://www.tiktok.com/@cuenta/video/…" autocomplete="off"></textarea>
      <button class="btn" type="submit">Guardar en mi biblioteca</button>
    </form>
    <h2>Mis envíos</h2>
    <ul id="lista" class="lista" aria-live="polite"></ul>
    <p class="soft vacio" id="vacio" hidden>Todavía no has mandado nada. Pega un enlace arriba y se descargará solo.</p>
  </section>

  <p class="aviso" id="aviso" role="status" hidden></p>
</main>
<script src="config.js"></script>
<script src="movil.js"></script>
</body>
</html>
